      #   run: |
      #     ENV="${{ steps.env.outputs.environment }}"
      #     if [ "$ENV" == "staging" ]; then
      #       BASE_URL="${{ secrets.BASE_URL_STAGING }}"
      #     else
      #       BASE_URL="${{ secrets.BASE_URL_PRODUCTION }}"
      #     fi

      #     flutter build web \
      #       --release \
      #       --web-renderer canvaskit \
      #       --dart-define=ENVIRONMENT="$ENV" \
      #       --dart-define=BASE_URL="$BASE_URL"

      # Deploys build/web to Firebase Hosting. Required secrets:
      # FIREBASE_SERVICE_ACCOUNT_KEY, FIREBASE_PROJECT_ID. Confirm a
      # hosting target matching `target` exists in firebase.json.
