name: Deploy Web

# ========================================================================
# PRODUCTION ACTIVATION CHECKLIST
# ========================================================================
# This workflow has THREE jobs (Firebase, Netlify, Vercel), each gated by
# the `platform` input — only one runs per dispatch. Pick the host you
# actually use and configure secrets for that job; leave the other two
# untouched.
#
# Shared secrets (any platform):
#   - BASE_URL_STAGING / BASE_URL_PRODUCTION
#   - SUPABASE_URL_PROD / SUPABASE_ANON_KEY_PROD
#
# Firebase-specific secrets:
#   - FIREBASE_SERVICE_ACCOUNT_KEY      service account JSON
#   - FIREBASE_PROJECT_ID
#   External setup: Firebase project + Hosting site; create hosting
#   targets named after each environment (staging/production).
#
# Netlify-specific secrets:
#   - NETLIFY_AUTH_TOKEN
#   - NETLIFY_SITE_ID
#   External setup: Netlify site created; auth token from User Settings.
#
# Vercel-specific secrets:
#   - VERCEL_TOKEN
#   - VERCEL_ORG_ID
#   - VERCEL_PROJECT_ID
#   External setup: Vercel project linked; values from `vercel link`
#   output or project settings.
#
# Activation order (per chosen platform):
#   1. Populate SUPABASE_URL_PROD / SUPABASE_ANON_KEY_PROD secrets so the
#      "Write .env from secrets" step has real values to interpolate.
#   2. Uncomment "Build Web" inside the chosen job.
#   3. Uncomment the platform-specific deploy step.
#   4. (Optional) Switch trigger to `push: branches: [main]` or
#      `push: tags: [v*.*.*]`.
# ========================================================================
#
# ------------------------------------------------------------------------
# Workflow Triggers Configuration
# ------------------------------------------------------------------------
# This is a starter template, so triggers are commented out by default.
# Uncomment and configure according to your deployment strategy:
#
# Option 1: Deploy on version tags
#   push:
#     tags:
#       - 'v*.*.*'  # Deploy when version tag is pushed (e.g., v1.0.0)
#
# Option 2: Deploy on branch push
#   push:
#     branches: [ main ]  # Deploy when pushing to main branch
#
# Option 3: Manual trigger only (workflow_dispatch)
#   - Keep push triggers commented
#   - Use GitHub Actions UI to trigger manually
# ------------------------------------------------------------------------
on:
  # push:
  #   branches: [ main ]  # Uncomment to deploy on branch push
  #   tags:
  #     - 'v*.*.*'  # Uncomment to deploy on version tags
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      platform:
        description: 'Hosting platform'
        required: true
        default: 'firebase'
        type: choice
        options:
          - firebase
          - netlify
          - vercel

jobs:
  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'firebase' || (github.event.inputs.platform == '' && github.event_name == 'push')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      # Writes `.env` from GitHub Secrets at runtime. Required secrets:
      # SUPABASE_URL_PROD, SUPABASE_ANON_KEY_PROD. Until those are set in
      # the repo, the interpolated values resolve to empty strings — still
      # safer than shipping the placeholder values from `.env.example`.
      - name: Write .env from secrets
        env:
          ENV_INPUT: ${{ github.event.inputs.environment }}
        run: |
          ENV="${ENV_INPUT:-production}"
          cat > .env <<EOF
          ENVIRONMENT=$ENV
          SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_PROD }}
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      # Builds the web bundle into build/web. Depends on signed `.env`
      # (FIXME above). Required secrets: BASE_URL_STAGING, BASE_URL_PRODUCTION.
