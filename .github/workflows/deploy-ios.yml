name: Deploy iOS

# ========================================================================
# PRODUCTION ACTIVATION CHECKLIST
# ========================================================================
# Required GitHub Secrets:
#   - APP_STORE_CONNECT_API_KEY_BASE64  AuthKey_<id>.p8, base64-encoded
#   - APP_STORE_CONNECT_API_KEY_ID
#   - APP_STORE_CONNECT_ISSUER_ID
#   - APPLE_CERTIFICATE_BASE64          distribution .p12, base64-encoded
#   - APPLE_CERTIFICATE_PASSWORD
#   - APPLE_TEAM_ID
#   - BASE_URL_STAGING / BASE_URL_PRODUCTION
#   - SUPABASE_URL_PROD / SUPABASE_ANON_KEY_PROD
#
# External setup before first run:
#   1. Apple Developer Program membership + distribution certificate
#      exported from Keychain as .p12.
#   2. App Store Connect API key (Users and Access > Integrations > Keys).
#   3. App record in App Store Connect with bundle ID matching the iOS
#      Runner project, and at least one TestFlight build slot.
#   4. Fastlane setup in `ios/fastlane/` if you want metadata sync
#      (optional, current Upload step uses `deliver` directly).
#
# Activation order:
#   1. Replace "Prepare .env from template" with a secrets-driven step
#      (see FIXME(deploy) note on that step).
#   2. Uncomment "Setup App Store Connect API Key".
#   3. Uncomment "Setup certificates and profiles".
#   4. Uncomment "Build IPA".
#   5. Uncomment "Upload to App Store Connect" (or leave commented and
#      rely on "Upload artifacts" + manual Transporter upload).
#   6. Switch trigger to `push: tags: [ 'v*.*.*' ]`.
# ========================================================================
#
# ------------------------------------------------------------------------
# Workflow Triggers Configuration
# ------------------------------------------------------------------------
# This is a starter template, so triggers are commented out by default.
# Uncomment and configure according to your deployment strategy:
#
# Option 1: Deploy on version tags
#   push:
#     tags:
#       - 'v*.*.*'  # Deploy when version tag is pushed (e.g., v1.0.0)
#
# Option 2: Deploy on branch push
#   push:
#     branches: [ main ]  # Deploy when pushing to main branch
#
# Option 3: Manual trigger only (workflow_dispatch)
#   - Keep push triggers commented
#   - Use GitHub Actions UI to trigger manually
# ------------------------------------------------------------------------
on:
  # push:
  #   tags:
  #     - 'v*.*.*'  # Uncomment to deploy on version tags
  #   branches: [ main ]  # Uncomment to deploy on branch push
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to App Store
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      # FIXME(deploy): `.env.example` has placeholder values — do NOT ship
      # this to prod. Before activating the build/upload steps below, swap
      # this for a step that writes `.env` from GitHub Secrets
      # (SUPABASE_URL_PROD, SUPABASE_ANON_KEY_PROD, ENVIRONMENT, etc.).
      - name: Prepare .env from template
        run: cp .env.example .env

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      # Writes the App Store Connect API key file used by `deliver` later.
