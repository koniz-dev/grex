name: Tests

# ========================================================================
# Workflow Triggers Configuration
# ========================================================================
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Verify formatting
        run: dart format --set-exit-if-changed .
        continue-on-error: false
      
      - name: Analyze code
        run: flutter analyze
        continue-on-error: false
      
      # Golden (screenshot) tests are excluded: pixel output depends on the host
      # renderer, so PNGs generated on a developer's macOS machine differ from a
      # Linux runner by roughly 0.2 percent of pixels in text antialiasing.
      # Loosening the comparison to bridge that gap would make the goldens prove
      # nothing, so they are verified locally instead - which is also where
      # acceptance evidence is produced. Tag declared in dart_test.yaml.
      - name: Run tests
        timeout-minutes: 15
        run: flutter test --coverage --timeout=5m --exclude-tags golden
        continue-on-error: false

      # --dart-define values are compile-time, so the only way to assert they
      # resolve is to compile a run with them set. The tests concerned skip
      # themselves when the defines are absent -- deliberately, because a test
      # asserting "the define is absent" would have passed against the bug it
      # exists to catch (issue #23). This step is what actually exercises them.
      - name: Verify --dart-define resolution
        timeout-minutes: 5
        run: |
          flutter test \
            --dart-define=SUPABASE_URL=https://define.test \
            --dart-define=API_TIMEOUT=77 \
            --dart-define=ENABLE_LOGGING=true \
            --dart-define=ENVIRONMENT=staging \
            test/core/config/env_config_dart_define_test.dart
      
      # ========================================================================
      # Coverage Processing - Critical Step
      # ========================================================================
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
      
      - name: Remove generated files from coverage
        run: |
          # Remove generated and non-testable files to match codecov.yml
          lcov --remove coverage/lcov.info --ignore-errors unused \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/*.config.dart' \
            '**/generated/**' \
            '**/l10n/**' \
            '**/main.dart' \
            'test/**' \
            '**/*_test.dart' \
            '**/test_helpers.dart' \
            '**/test_fixtures.dart' \
            -o coverage/lcov.info
          echo "✅ Removed generated files from coverage report"
      
      - name: Generate coverage report
        run: |
          genhtml coverage/lcov.info -o coverage/html --no-function-coverage
      
      # Measures coverage, enforces the baseline, and renders the PR table --
      # all three from one script so the number in the comment and the number
      # the gate judges can never disagree. Thresholds live in
      # scripts/linux/testing/coverage_baseline.env.
      #
      # The gate is deliberately not `run:`-fails-the-step: the PR comment must
      # post even on a failure, so the verdict is captured here and enforced in
      # the last step of the job.
      - name: Coverage gate
        id: gate
        shell: bash
        run: |
          chmod +x scripts/linux/testing/calculate_layer_coverage.sh \
                   scripts/linux/testing/check_coverage_thresholds.sh

          if ./scripts/linux/testing/check_coverage_thresholds.sh \
               coverage/lcov.info > /tmp/coverage-report.md; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

          cat /tmp/coverage-report.md

          {
            echo 'report<<COVERAGE_REPORT_EOF'
            cat /tmp/coverage-report.md
            echo 'COVERAGE_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html
          retention-days: 30
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ## 📊 Test Coverage Report

            ${{ steps.gate.outputs.report }}

            Full HTML report in the [workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      # Last, so the comment above is always posted before the job goes red.
      - name: Enforce coverage baseline
        if: steps.gate.outputs.passed != 'true'
        run: |
          echo "Coverage fell below the baseline in" \
               "scripts/linux/testing/coverage_baseline.env."
          echo "Add tests for the layer flagged above. Do not lower the baseline."
          exit 1
