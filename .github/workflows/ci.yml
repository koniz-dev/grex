name: CI Builds

# ========================================================================
# Manual builds for QA / artifact sharing.
#
# Test + analyze + coverage live in `test.yml` (auto-runs on push/PR to
# main). This workflow only produces install artifacts on demand.
# ========================================================================
on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (Development)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Development)
        run: |
          flutter build apk \
            --flavor development \
            --dart-define=ENVIRONMENT=development \
            --dart-define=BASE_URL=http://localhost:3000

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    name: Build iOS (Development)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS (Development)
        run: |
          flutter build ios \
            --flavor development \
            --no-codesign \
            --dart-define=ENVIRONMENT=development \
            --dart-define=BASE_URL=http://localhost:3000

  build-web:
    name: Build Web (Development)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web (Development)
        run: |
          flutter build web \
            --dart-define=ENVIRONMENT=development \
            --dart-define=BASE_URL=http://localhost:3000

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
